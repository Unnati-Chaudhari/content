<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Login-form</title>
</head>
<body>
    <form>
      <div class="main_container">
       <h2>LOGIN</h2>
       <div class="input_div">
        <p class="title">Email</p>
        <input type="email">
       </div>
       <div class="input_div">
        <p class="title">Password</p>
        <input type="password">
       </div>

       <button>Sign In</button>
       <p class="forget_pass">Forget Password? <span>Sign Up</span></p>
      </div>
    </form>
</body>
</html>
